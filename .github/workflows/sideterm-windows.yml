name: sideterm-windows

# Standalone packaging workflow for Sideterm, hand-written (NOT generated by
# ci/generate-workflows.py) so that upstream workflow regeneration never
# touches it. Modelled on gen_windows.yml, minus tests, with Sideterm
# branding in the packaging step.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the artifacts (default: YYYYMMDD-HHMMSS-<commit>)"
        required: false
        default: ""

jobs:
  build:
    runs-on: "windows-2025"

    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          target: "x86_64-pc-windows-msvc"
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependecies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Build wezterm (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build -p wezterm --release
      - name: "Build wezterm-gui (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build -p wezterm-gui --release
      - name: "Build wezterm-mux-server (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build -p wezterm-mux-server --release
      - name: "Build strip-ansi-escapes (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build -p strip-ansi-escapes --release
      - name: "Package"
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e
          TAG_NAME="$INPUT_VERSION"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME=$(bash ci/tag-name.sh)
          fi
          echo "Packaging version: $TAG_NAME"
          zipdir=Sideterm-windows-$TAG_NAME
          rm -rf "$zipdir" "$zipdir.zip"
          mkdir -p "$zipdir/mesa"
          cp target/release/wezterm.exe \
            target/release/wezterm-mux-server.exe \
            target/release/wezterm-gui.exe \
            target/release/strip-ansi-escapes.exe \
            target/release/wezterm.pdb \
            assets/windows/conhost/conpty.dll \
            assets/windows/conhost/OpenConsole.exe \
            assets/windows/angle/libEGL.dll \
            assets/windows/angle/libGLESv2.dll \
            "$zipdir"
          cp target/release/mesa/opengl32.dll "$zipdir/mesa"
          7z a -tzip "$zipdir.zip" "$zipdir"
          iscc.exe -DMyAppVersion="$TAG_NAME" -FSideterm-$TAG_NAME-setup ci/sideterm-installer.iss
      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "sideterm-windows"
          path: |
            Sideterm-*.zip
            Sideterm-*-setup.exe
